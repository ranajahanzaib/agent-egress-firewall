# Agent Egress Firewall (AEGF) Configuration
# Primary Egress Security Gateway

server:
  listen: "127.0.0.1:8080"
  read_timeout: 30s
  write_timeout: 60s
  idle_timeout: 90s
  shutdown_timeout: 15s
  max_body_size_bytes: 10485760 # 10MB
  max_concurrency: 500
  inference_timeout: 5s

inference:
  address: "127.0.0.1:50051"
  timeout: 5s
  enable_ml: true
  enable_patterns: true
  min_confidence: 0.50
  max_spans_per_field: 100

vault:
  enabled: true
  db_path: "vault.db"
  master_key: "" # Or provide via AEGF_VAULT_KEY env var
  key_file: "vault.key"
  retention: "30d"

audit:
  enabled: true
  db_path: "audit.db"
  retention: "90d"

routes:
  - id: openai
    match:
      path_prefix: /openai
    upstream: https://api.openai.com
    strip_prefix: true
    policy: strict-ai-egress
    inspect_headers:
      - X-User-Identity
      - X-Client-Email

  - id: anthropic
    match:
      path_prefix: /anthropic
    upstream: https://api.anthropic.com
    strip_prefix: true
    policy: strict-ai-egress

  - id: internal-api
    match:
      path_prefix: /internal-api
    upstream: https://api.example.com
    strip_prefix: true
    policy: internal-api-policy

policies:
  - name: strict-ai-egress
    default_action: allow
    minimum_confidence: 0.65
    on_detection:
      PERSON: redact
      EMAIL: redact
      PHONE: redact
      API_KEY: block
      PRIVATE_KEY: block
      ACCOUNT_NUMBER: redact
      INTERNAL_SECRET: block
      INTERNAL_PROJECT: redact
      NETWORK_IDENTIFIER: allow
    destinations:
      - "*.openai.com"
      - "*.anthropic.com"
    exceptions:
      - destination: "*.openai.com"
        allow:
          - NETWORK_IDENTIFIER
    failure_behavior:
      inference_unavailable: block
      inference_timeout: block
      malformed_payload: block
      unsupported_content: block
      oversized_payload: block

  - name: internal-api-policy
    default_action: allow
    minimum_confidence: 0.70
    on_detection:
      API_KEY: block
      PRIVATE_KEY: block
      INTERNAL_SECRET: block
    failure_behavior:
      inference_unavailable: block
      inference_timeout: block
      malformed_payload: block
      unsupported_content: allow
      oversized_payload: block

entities:
  - name: PERSON
    description: "Names of individual persons"
    enabled: true
    confidence_threshold: 0.60

  - name: EMAIL
    description: "Email addresses"
    enabled: true
    confidence_threshold: 0.55

  - name: PHONE
    description: "Telephone and mobile numbers"
    enabled: true
    confidence_threshold: 0.65

  - name: API_KEY
    description: "Authentication tokens, access keys, and credentials"
    enabled: true
    confidence_threshold: 0.70

  - name: ACCOUNT_NUMBER
    description: "Customer financial and account identifiers"
    enabled: true
    confidence_threshold: 0.75

  - name: INTERNAL_PROJECT
    description: "Internal confidential project names"
    enabled: true
    confidence_threshold: 0.60

patterns:
  - name: INTERNAL_ACCOUNT_NUMBER
    category: ACCOUNT_NUMBER
    regex: '\bACCT-[A-Z0-9]{8}\b'
    confidence: 1.0
    enabled: true

  - name: INTERNAL_PROJECT_TOKEN
    category: INTERNAL_PROJECT
    regex: '\bproject-[a-z0-9_-]{6,}\b'
    confidence: 0.95
    enabled: true

  - name: INTERNAL_SECRET_KEY
    category: INTERNAL_SECRET
    regex: '\bsec_[a-f0-9]{32}\b'
    confidence: 1.0
    enabled: true
