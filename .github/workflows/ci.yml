name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "3.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Go Formatting
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following Go files are not formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run Go Vet
        run: go vet ./...

      - name: Verify Rust Formatting
        run: |
          cd inference
          cargo fmt -- --check

      - name: Run Cargo Clippy
        run: |
          cd inference
          cargo clippy -- -D warnings

  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "inference -> inference/target"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "3.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache GLiNER ONNX Model Assets
        id: cache-models
        uses: actions/cache@v4
        with:
          path: models/gliner-small
          key: models-gliner-small-v1

      - name: Download Model Assets
        if: steps.cache-models.outputs.cache-hit != 'true'
        run: python3 scripts/download_model.py

      - name: Run Rust Unit Tests
        run: |
          cd inference
          cargo test

      - name: Build Binaries
        run: |
          mkdir -p bin
          go build -o bin/aegf ./cmd/aegf
          cd inference && cargo build --release && cp target/release/aegf-inference ../bin/ && cd ..

      - name: Run Go Unit Tests
        run: go test -v -race ./internal/...

      - name: Run End-to-End Integration Tests
        run: go test -v -race ./tests/integration/...

      - name: Run Model Quality Evaluation Benchmark
        run: |
          ./bin/aegf-inference --listen 127.0.0.1:50051 --model-dir models/gliner-small > /tmp/inf.log 2>&1 &
          INF_PID=$!
          sleep 2
          go run scripts/evaluate.go
          kill $INF_PID 2>/dev/null || true

      - name: Run End-to-End Demo Script
        run: ./scripts/demo.sh

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: aegf:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
